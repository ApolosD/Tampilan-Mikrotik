version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mikrotik-dashboard-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.streamlit:/app/.streamlit
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: mikrotik-dashboard-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/vps/nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - proxy
